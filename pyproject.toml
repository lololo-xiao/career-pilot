[project]
name = "career-pilot"
version = "0.1.0"
description = "Evidence-grounded career matching and interview preparation agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "chromadb>=1.5.9",
    "cryptography>=45.0.0",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "langfuse>=4.14.0",
    "langgraph>=1.2.9",
    "mcp==1.26.0",
    "openai>=2.45.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
companion = [
    "playwright==1.61.0",
]

[project.scripts]
career-companion = "career_companion.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "career_companion", "job_pipeline"]
exclude = ["/career_companion/web"]

[tool.hatch.build.targets.wheel.shared-data]
"agent-profile" = "share/career-pilot/agent-profile"

[tool.hatch.build.hooks.custom]
path = "career_companion/hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["/career_companion/web", "/frontend/out"]
include = [
    "/app",
    "/career_companion",
    "/job_pipeline",
    "/agent-profile",
    "/migrations",
    "/frontend",
    "/installers",
    "/scripts",
    "/alembic.ini",
    "/LICENSE",
    "/README.md",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
